<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <nav class="nav-container">
      <a href="{{ '/' | relative_url }}" class="site-logo">
        <img src="{{ '/assets/shuttle-logo-36px.svg' | relative_url }}" alt="Shuttle" class="logo-icon" width="24" height="24">
        <span class="logo-text">Shuttle</span>
      </a>
      <div class="nav-links">
        <a href="{{ '/knowledge/' | relative_url }}">Knowledge</a>
        <a href="{{ '/tutorials/' | relative_url }}">Tutorials</a>
        <a href="{{ '/story/' | relative_url }}">Story</a>
      </div>
    </nav>
  </header>

  <main class="main-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <p>Content for <a href="https://wwwshuttle.app" target="_blank" rel="noopener">Shuttle</a> — two-dimensional thinking for the modern mind</p>
      <p class="footer-links">
        <a href="https://wwwshuttle.app">Get Shuttle</a>
        <span class="separator">·</span>
        <a href="https://github.com/funclosure/weaving-shuttle">GitHub</a>
      </p>
    </div>
  </footer>
</body>
</html>
